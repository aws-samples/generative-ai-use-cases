[project]
name = "generic-agent-core-runtime"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "strands-agents>=1.0",
  "strands-agents-tools[agent_core_code_interpreter,agent_core_browser]",
  "boto3",
  "mcp",
  "fastapi",
  "uvicorn",
  "pydantic",
  "aws-opentelemetry-distro>=0.10.1",
]

[tool.uv]
# Security floors for transitive dependencies (not imported directly).
# Raise these when Dependabot reports a vulnerable locked version.
constraint-dependencies = [
  # 0.9.0 removed code_interpreter (used by the AgentCore code interpreter tool).
  "strands-agents-tools<0.9",
  "aiohttp>=3.14.4",
  "bedrock-agentcore>=1.18.1",
  "cryptography>=50.0.0",
  "mcp>=1.30.0,<2",
  "multidict>=6.9.1",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-propagator-jaeger>=1.45.0",
  "pillow>=13.0.0",
  "python-multipart>=0.0.26",
  "urllib3>=2.8.0",
]

[dependency-groups]
lint = [
  "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py313"
line-length = 500

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"