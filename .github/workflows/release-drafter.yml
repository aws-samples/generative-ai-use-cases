name: Release Drafter

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'new-release'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          # v7 defaults both to the event ref (refs/pull/N/merge on pull_request),
          # which forces dry-run mode. Pin them to main.
          commitish: main
          config-name: release-drafter.yml@main
          token: ${{ secrets.GITHUB_TOKEN }}
