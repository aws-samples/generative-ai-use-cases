# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js(Web + CDK) CI

on:
  push:
    branches: ['main']
    paths-ignore: ['browser-extension/**']
  pull_request:
    branches: ['main']
    paths-ignore: ['browser-extension/**']

jobs:
  check-lint-build:
    name: 'Check test, lint and build'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    env:
      CDK_DEFAULT_ACCOUNT: 123456789012

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test
      - run: npm run custom-lint:build
      - run: npm run web:lint
      - run: npm run cdk:lint
      - run: npm run web:build
      - run: npm run cdk:build
      - run: npm run cdk:test
      # Fails when the pull request replaces, deletes or orphans a stateful
      # resource in the CDK snapshot. It catches accidental changes; it is not
      # a control against a malicious one. See CONTRIBUTING.md.
      - name: Check for destructive changes to stateful resources
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SNAPSHOT: packages/cdk/test/__snapshots__/generative-ai-use-cases.test.ts.snap
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:$SNAPSHOT" > "$RUNNER_TEMP/base.snap"
          cd packages/cdk
          npx ts-node scripts/destructive-guard.ts "$RUNNER_TEMP/base.snap" "$GITHUB_WORKSPACE/$SNAPSHOT"
      - run: npm -w packages/cdk run cdk synth
